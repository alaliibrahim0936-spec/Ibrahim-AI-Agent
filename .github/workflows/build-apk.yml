name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: فك المشروع
        run: |
          rm -rf project
          mkdir -p project
          unzip -o -q Ibrahim_AI_Agent_v1.zip -d project
          echo "--- محتويات المشروع ---"
          ls -R project | head -n 200

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v4

      - name: تثبيت SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: بناء APK
        run: |
          cd project
          # البحث عن مجلد المشروع الحقيقي
          APP_DIR=$(find . -name "build.gradle*" | head -n 1 | xargs dirname)
          echo "مجلد التطبيق هو: $APP_DIR"
          cd "$APP_DIR"
          if [ ! -f "gradlew" ]; then
            echo "gradlew غير موجود، سيتم إنشاؤه"
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: Ibrahim-AI-Agent-APK
          path: |
            **/build/outputs/apk/debug/*.apk
