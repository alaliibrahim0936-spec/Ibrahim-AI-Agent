name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          rm -rf project
          mkdir -p project
          unzip -o -q Ibrahim_AI_Agent_v1.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - name: تثبيت SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: إعداد Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: بناء APK
        run: |
          cd project
          APP_DIR=$(find . -name "build.gradle*" | head -n 1 | xargs dirname)
          echo "مجلد التطبيق: $APP_DIR"
          cd "$APP_DIR"
          cd ../..
          pwd
          ls -la
          # إنشاء gradlew باصدار 8.7 وليس 9.6
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Ibrahim-AI-Agent-APK
          path: "**/build/outputs/apk/debug/*.apk"
