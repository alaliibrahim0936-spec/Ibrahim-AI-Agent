name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: فك المشروع
        run: |
          rm -rf project
          mkdir -p project
          unzip -o -q Ibrahim_AI_Agent_v1.zip -d project
          ls -R project | head -n 100

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Android SDK الجديد
        uses: android-actions/setup-android@v4

      - name: تثبيت Android SDK 36
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: بناء APK
        run: |
          GRADLEW_PATH=$(find project -name gradlew | head -n 1)
          echo "Found gradlew at: $GRADLEW_PATH"
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: حفظ APK
        uses: actions/upload-artifact@v4
        with:
          name: Ibrahim-AI-Agent-APK
          path: |
            **/app/build/outputs/apk/debug/*.apk
